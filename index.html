function getWebpSrc(src) {
  return src.replace(/\.(png|jpg|jpeg|gif|bmp|tiff|avif)$/i, '.webp');
}

function WebpImage({ src, alt, className, onError, onClick, style }) {
  return (
    <picture>
      <source srcSet={getWebpSrc(src)} type="image/webp" />
      <img
        src={src}
        alt={alt}
        className={className}
        onError={onError}
        onClick={onClick}
        style={style}
      />
    </picture>
  );
}

/* ─── COMPONENTE: LightboxImage ────────────────────
       Overlay fullscreen para ampliar la imagen.
       Cierra con Escape o clic fuera.
    ──────────────────────────────────────────────────── */
    function LightboxImage({ src, alt, onClose }) {
      React.useEffect(() => {
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [onClose]);

      return (
        <div
          className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/95 backdrop-blur-sm p-4"
          onClick={onClose}
        >
          <button
            onClick={onClose}
            className="absolute top-4 right-4 w-10 h-10 bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-slate-300 hover:text-white transition z-10"
          >
            <i className="fa-solid fa-xmark text-lg"></i>
          </button>
          <WebpImage
            src={src} alt={alt}
            onClick={(e) => e.stopPropagation()}
            className="max-w-full max-h-[90vh] rounded-xl object-contain shadow-2xl"
            style={{ userSelect: "none", cursor: "zoom-in" }}
          />
        </div>
      );
    }

    /* ─── COMPONENTE: ImageGallery ─────────────────────
       Carousel con thumbnails, swipe táctil y lightbox.
       Acepta imágenes WebP; muestra placeholder si fallan.
    ──────────────────────────────────────────────────── */
    function ImageGallery({ images }) {
      const [current,  setCurrent]  = React.useState(0);
      const [imgError, setImgError] = React.useState({});
      const [lightbox, setLightbox] = React.useState(false);
      const touchStartX = React.useRef(null);

      if (!images || images.length === 0) return null;

      const prev = () => setCurrent(i => (i - 1 + images.length) % images.length);
      const next = () => setCurrent(i => (i + 1) % images.length);

      const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const handleTouchEnd   = (e) => {
        if (touchStartX.current === null) return;
        const diff = touchStartX.current - e.changedTouches[0].clientX;
        if (diff > 40) next(); else if (diff < -40) prev();
        touchStartX.current = null;
      };

      const src      = images[current];
      const hasError = imgError[current];

      return (
        <>
          {lightbox && !hasError && (
            <LightboxImage src={src} alt={"zoom-" + current} onClose={() => setLightbox(false)} />
          )}
          <div className="space-y-3">
            {/* Imagen principal */}
            <div
              className="relative rounded-xl overflow-hidden bg-slate-900 border border-slate-800 select-none"
              style={{ minHeight: "180px" }}
              onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}
            >
              {hasError ? (
                <div className="flex flex-col items-center justify-center h-48 text-slate-600 space-y-2">
                  <i className="fa-solid fa-image text-3xl"></i>
                  <span className="text-xs code-font">{src}</span>
                </div>
              ) : (
                <WebpImage
                  key={src} src={src} alt={"preview-" + current}
                  onError={() => setImgError(prev => ({ ...prev, [current]: true }))}
                  className="w-full object-contain max-h-72 mx-auto block cursor-zoom-in"
                  onClick={() => setLightbox(true)}
                />
              )}
              {!hasError && (
                <button
                  onClick={() => setLightbox(true)}
                  className="absolute top-2 right-2 w-7 h-7 bg-slate-950/80 hover:bg-slate-900 border border-slate-700 rounded-lg flex items-center justify-center text-slate-300 hover:text-accentNeon transition"
                  title="Ver en pantalla completa"
                >
                  <i className="fa-solid fa-magnifying-glass-plus text-xs"></i>
                </button>
              )}
              {images.length > 1 && (
                <>
                  <button onClick={prev} className="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-slate-950/80 hover:bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-slate-300 hover:text-white transition">
                    <i className="fa-solid fa-chevron-left text-xs"></i>
                  </button>
                  <button onClick={next} className="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-slate-950/80 hover:bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-slate-300 hover:text-white transition">
                    <i className="fa-solid fa-chevron-right text-xs"></i>
                  </button>
                  <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1.5">
                    {images.map((_, i) => (
                      <button key={i} onClick={() => setCurrent(i)}
                        className={"rounded-full transition-all " + (i === current ? "bg-accentNeon w-3 h-1.5" : "bg-slate-600 hover:bg-slate-400 w-1.5 h-1.5")}
                      />
                    ))}
                  </div>
                </>
              )}
            </div>
            {/* Thumbnails */}
            {images.length > 1 && (
              <div className="flex gap-2 overflow-x-auto pb-1">
                {images.map((img, i) => {
                  const err = imgError[i];
                  return (
                    <button key={i} onClick={() => setCurrent(i)}
                      className={"flex-shrink-0 w-14 h-14 rounded-lg overflow-hidden border-2 transition bg-slate-900 flex items-center justify-center " +
                        (i === current ? "border-accentNeon" : "border-slate-800 hover:border-slate-600")}
                    >
                      {err
                        ? <i className="fa-solid fa-image text-slate-600 text-xs"></i>
                        : <WebpImage src={img} alt={"thumb-" + i} onError={() => setImgError(prev => ({ ...prev, [i]: true }))} className="w-full h-full object-cover" />
                      }
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        </>
      );
    }
